<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgendaEstética - Configuração Inicial">
  <meta name="theme-color" content="#2d9482">
  <title>AgendaEstética - Configuração Inicial</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:560px;">
      <header class="auth-card__header">
        <div class="auth-card__logo">✨</div>
        <h1 class="auth-card__title">Configuração Inicial</h1>
        <p class="auth-card__subtitle">Complete seu cadastro para começar a receber agendamentos</p>
      </header>

      <form id="form-onboarding" class="auth-form">
        <fieldset class="form-fieldset">
          <legend class="form-legend">Informações do Estabelecimento</legend>

          <div class="form-group">
            <label for="empresa-nome" class="form-label">Nome do Estabelecimento</label>
            <input id="empresa-nome" name="empresaNome" type="text" class="form-input" required placeholder="Ex: Salão Beleza Total" />
          </div>

          <div class="form-group">
            <label for="telefone" class="form-label">Telefone de Contato</label>
            <input id="telefone" name="telefone" type="tel" class="form-input" placeholder="(11) 9 9999-9999" />
          </div>

          <div class="form-group">
            <label for="servicos" class="form-label">Serviços (separar por vírgula)</label>
            <input id="servicos" name="servicos" type="text" class="form-input" placeholder="Corte, Escova, Hidratação" />
            <small class="form-hint">Liste os serviços que você oferece</small>
          </div>
        </fieldset>

        <fieldset class="form-fieldset">
          <legend class="form-legend">Horários de Trabalho</legend>

          <div class="form-group">
            <label class="form-label">Dias da Semana</label>
            <div class="dias-checkboxes">
              <label class="form-check">
                <input type="checkbox" name="dias" value="mon" class="form-check-input" />
                <span class="form-check-label">Seg</span>
              </label>
              <label class="form-check">
                <input type="checkbox" name="dias" value="tue" class="form-check-input" />
                <span class="form-check-label">Ter</span>
              </label>
              <label class="form-check">
                <input type="checkbox" name="dias" value="wed" class="form-check-input" />
                <span class="form-check-label">Qua</span>
              </label>
              <label class="form-check">
                <input type="checkbox" name="dias" value="thu" class="form-check-input" />
                <span class="form-check-label">Qui</span>
              </label>
              <label class="form-check">
                <input type="checkbox" name="dias" value="fri" class="form-check-input" />
                <span class="form-check-label">Sex</span>
              </label>
              <label class="form-check">
                <input type="checkbox" name="dias" value="sat" class="form-check-input" />
                <span class="form-check-label">Sáb</span>
              </label>
              <label class="form-check">
                <input type="checkbox" name="dias" value="sun" class="form-check-input" />
                <span class="form-check-label">Dom</span>
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label for="hora-inicio" class="form-label">Hora Início</label>
              <input id="hora-inicio" name="horaInicio" type="time" class="form-input" value="09:00" required />
            </div>
            <div class="form-group" style="flex:1;">
              <label for="hora-fim" class="form-label">Hora Fim</label>
              <input id="hora-fim" name="horaFim" type="time" class="form-input" value="18:00" required />
            </div>
          </div>

          <div class="form-group">
            <label for="duracao-slot" class="form-label">Duração do Slot (min)</label>
            <input id="duracao-slot" name="duracaoSlot" type="number" class="form-input" min="5" max="240" value="30" required />
            <small class="form-hint">Tempo padrão de cada atendimento</small>
          </div>
        </fieldset>

        <button type="submit" class="btn btn--primary w-full btn--lg">Salvar e Continuar</button>

        <div id="onboarding-mensagem" class="d-none alert" role="status"></div>
      </form>
    </div>
  </div>

  <script type="module" src="/pages/onboarding.js"></script>
</body>
</html>
