<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgendaEstética - Solicitações de Troca">
  <meta name="theme-color" content="#2d9482">
  <title>AgendaEstética - Solicitações de Troca</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-header__logo">✨ AgendaEstética</div>
      </div>
    </header>

    <main class="app-main page-enter">
      <div class="page">
        <header class="page-header">
          <a href="/dashboard" class="btn btn--ghost mb-2">← Voltar ao Dashboard</a>
          <h1 class="page-header__title">Solicitações de Troca</h1>
          <p class="page-header__subtitle">Gerencie pedidos de reagendamento dos seus clientes</p>
        </header>

        <div class="tabs mb-4">
          <button class="tab tab--active" data-filter="pendentes">Pendentes</button>
          <button class="tab" data-filter="todas">Todas</button>
        </div>

        <section id="lista-solicitacoes">
          <div class="loading-state"><p>Carregando solicitações...</p></div>
        </section>
      </div>
    </main>

    <!-- Modal -->
    <div id="modal-detalhes" class="modal-overlay">
      <div class="modal modal--active" style="max-width:500px;">
        <div class="modal__header">
          <h3 class="modal__title">Detalhes da Solicitação</h3>
          <button class="modal__close" id="fechar-modal">&times;</button>
        </div>
        <div class="modal__body" id="detalhes-conteudo"></div>
        <div class="modal__footer" id="modal-actions"></div>
      </div>
    </div>

    <div id="mensagem" class="d-none"></div>
  </div>

  <script type="module" src="/pages/solicitacoes-troca.js"></script>
</body>
</html>
