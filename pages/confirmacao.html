<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Realizado - AgendaEstética</title>
    <!-- CSS Principal (Design System v2) -->
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div class="container">
        <div class="card confirmation-card">
            <div class="icon-success">✅</div>
            
            <h1>Cadastro Realizado com Sucesso!</h1>
            
            <p class="message">
                Bem-vindo ao AgendaEstética, <span id="user-name">Cliente</span>!
            </p>
            
            <p class="details">
                Seu email: <span id="user-email"></span>
                <br>
                Tipo: <span id="user-role"></span>
            </p>
            
            <div class="actions">
                <button id="continue-btn" class="btn btn--primary">
                    Continuar
                </button>
            </div>
            
            <p class="help-text">
                Em caso de dúvidas, entre em contato com o suporte.
            </p>
        </div>
    </div>
    
    <script type="module">
        // Importar funções de autenticação
        import { obterUsuarioAtual } from '../modules/auth.js';
        
        console.log('✅ confirmacao.js loaded');
        
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🔧 Confirmation page initializing');
            
            const usuario = obterUsuarioAtual();
            
            if (usuario) {
                // User is logged in
                document.getElementById('user-name').textContent = usuario.nome || 'Cliente';
                document.getElementById('user-email').textContent = usuario.email || '';
                document.getElementById('user-role').textContent = 
                    usuario.role === 'profissional' ? 'Profissional' : 'Cliente';
                
                const continueBtn = document.getElementById('continue-btn');
                continueBtn.onclick = () => {
                    window.location.href = usuario.role === 'profissional' 
                        ? '/dashboard' 
                        : '/meus-agendamentos';
                };
            } else {
                // No user - show generic confirmation
                document.getElementById('user-name').textContent = 'Bem-vindo!';
                
                const continueBtn = document.getElementById('continue-btn');
                continueBtn.onclick = () => {
                    window.location.href = '/login';
                };
            }
        });
    </script>
    
    <style>
        .confirmation-card {
            max-width: 450px;
            margin: 60px auto;
            text-align: center;
            padding: 40px;
        }
        
        .icon-success {
            font-size: 4rem;
            margin-bottom: var(--spacing-4);
        }
    </style>
</body>
</html>
